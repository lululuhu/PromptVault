[package]
name = "prv"
version = "0.3.0"
edition = "2021"
authors = ["prv Contributors"]
license = "MIT"
description = "Prove your prompts — version, diff, branch, evaluate, and serve AI prompts. Local-first, blazingly fast."
repository = "https://github.com/lululuhu/prv"
homepage = "https://github.com/lululuhu/prv"
keywords = ["prompt", "prompt-engineering", "version-control", "ai", "llm"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "pv"
path = "src/main.rs"

[lib]
name = "prv"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
sha2 = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nu-ansi-term = "0.50"
ratatui = "0.28"
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Enable `pv run` — model calls over HTTP. Off by default so the default build
# has zero network code and no HTTP dependencies.
run = ["dep:reqwest", "dep:tiktoken-rs"]
# Enable `pv serve` — local HTTP server + Web GUI. Off by default so the
# default build has zero HTTP server code. Implies `run` so the OpenAI-
# compatible endpoint can call LLM providers.
serve = ["dep:tiny_http", "run"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls", "blocking"]
optional = true

[dependencies.tiktoken-rs]
version = "0.5"
optional = true

[dependencies.tiny_http]
version = "0.12"
optional = true

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
