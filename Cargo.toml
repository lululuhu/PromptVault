[package]
name = "promptvault"
version = "0.1.0"
edition = "2021"
authors = ["PromptVault Contributors"]
license = "MIT"
description = "Git for AI Prompts — version, diff, branch, and roll back your prompts. Local-first, blazingly fast."
repository = "https://github.com/lululuhu/promptvault"
homepage = "https://github.com/lululuhu/promptvault"
keywords = ["prompt", "prompt-engineering", "version-control", "ai", "llm"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "pv"
path = "src/main.rs"

[lib]
name = "promptvault"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nu-ansi-term = "0.50"
ratatui = "0.28"
crossterm = "0.28"

[features]
default = []
# Enable `pv run` — model calls over HTTP. Off by default so the default build
# has zero network code and no HTTP dependencies.
run = ["dep:reqwest", "dep:tiktoken-rs"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls", "blocking"]
optional = true

[dependencies.tiktoken-rs]
version = "0.5"
optional = true

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
