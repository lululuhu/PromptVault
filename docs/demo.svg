<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1120" font-family="'Menlo','Monaco','Consolas','Courier New',monospace" font-size="13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="1" stop-color="#0d0d16"/>
    </linearGradient>
    <style>
      text { fill: #cdd6f4; }
      .prompt { fill: #89b4fa; }
      .cmd { fill: #cdd6f4; }
      .dim { fill: #6c7086; }
      .ok { fill: #a6e3a1; }
      .add { fill: #a6e3a1; }
      .del { fill: #f38ba8; }
      .hash { fill: #fab387; }
      .yellow { fill: #f9e2af; }
      .mauve { fill: #cba6f7; }
      .teal { fill: #94e2d5; }
      .title { fill: #cdd6f4; font-weight: bold; }
      .label { fill: #89b4fa; font-weight: bold; }
      .panel-title { fill: #6c7086; font-size: 13px; font-weight: bold; }
      @media (prefers-reduced-motion: no-preference) {
        .fade { opacity: 0; animation: fi 0.4s ease forwards; }
        .l1 { animation-delay: 0.1s; } .l2 { animation-delay: 0.3s; }
        .l3 { animation-delay: 0.5s; } .l4 { animation-delay: 0.7s; }
        .l5 { animation-delay: 0.9s; } .l6 { animation-delay: 1.1s; }
        .l7 { animation-delay: 1.3s; } .l8 { animation-delay: 1.5s; }
        .l9 { animation-delay: 1.7s; } .l10 { animation-delay: 1.9s; }
        .l11 { animation-delay: 2.1s; } .l12 { animation-delay: 2.3s; }
        .l13 { animation-delay: 2.5s; } .l14 { animation-delay: 2.7s; }
        .l15 { animation-delay: 2.9s; } .l16 { animation-delay: 3.1s; }
        @keyframes fi { to { opacity: 1; } }
      }
    </style>
  </defs>

  <!-- outer background -->
  <rect width="880" height="1120" rx="14" fill="url(#bg)"/>

  <!-- title bar -->
  <text x="40" y="48" class="title" font-size="22">prv — Prove your prompts</text>
  <text x="40" y="70" class="dim" font-size="13">local-first · version, diff, branch, and roll back your prompts</text>

  <!-- ===== Panel 1: init + add + commit ===== -->
  <g transform="translate(40, 95)">
    <rect width="800" height="220" rx="8" fill="url(#term)" stroke="#313244" stroke-width="1"/>
    <!-- traffic lights -->
    <circle cx="20" cy="20" r="6" fill="#f38ba8"/>
    <circle cx="40" cy="20" r="6" fill="#f9e2af"/>
    <circle cx="60" cy="20" r="6" fill="#a6e3a1"/>
    <text x="400" y="25" class="panel-title" text-anchor="middle">— pv init · add · commit —</text>

    <text x="20" y="58" class="fade l1"><tspan class="prompt">$ </tspan><tspan class="cmd">pv init</tspan></text>
    <text x="20" y="76" class="fade l1 dim">Initialized empty prompt vault in ./.pv</text>

    <text x="20" y="104" class="fade l2"><tspan class="prompt">$ </tspan><tspan class="cmd">pv add prompts/</tspan></text>
    <text x="20" y="122" class="fade l2 ok">added: prompts/summarize.md</text>
    <text x="20" y="140" class="fade l2 ok">added: prompts/translate.md</text>

    <text x="20" y="168" class="fade l3"><tspan class="prompt">$ </tspan><tspan class="cmd">pv commit -m </tspan><tspan class="yellow">"feat: initial prompt set"</tspan></text>
    <text x="20" y="186" class="fade l3"><tspan class="hash">[main 4100199]</tspan> feat: initial prompt set</text>
    <text x="20" y="204" class="fade l3 dim"> 2 prompts</text>
  </g>

  <!-- ===== Panel 2: diff ===== -->
  <g transform="translate(40, 330)">
    <rect width="800" height="200" rx="8" fill="url(#term)" stroke="#313244" stroke-width="1"/>
    <circle cx="20" cy="20" r="6" fill="#f38ba8"/>
    <circle cx="40" cy="20" r="6" fill="#f9e2af"/>
    <circle cx="60" cy="20" r="6" fill="#a6e3a1"/>
    <text x="400" y="25" class="panel-title" text-anchor="middle">— pv diff (see exactly what changed) —</text>

    <text x="20" y="58" class="fade l4"><tspan class="prompt">$ </tspan><tspan class="cmd">pv diff prompts/summarize.md</tspan></text>
    <text x="20" y="82" class="fade l5 dim">diff -- prompts/summarize.md</text>
    <text x="20" y="100" class="fade l5"> You are a precise summarizer.</text>
    <text x="20" y="118" class="fade l5"></text>
    <text x="20" y="136" class="fade l6 del">-Summarize in 3 concise bullets, then propose a title.</text>
    <text x="20" y="154" class="fade l6 add">+Summarize in 3 concise bullets, a title, and note the tone.</text>
    <text x="20" y="172" class="fade l6"></text>
    <text x="20" y="190" class="fade l6 teal"> {{text}}</text>
  </g>

  <!-- ===== Panel 3: log ===== -->
  <g transform="translate(40, 545)">
    <rect width="800" height="180" rx="8" fill="url(#term)" stroke="#313244" stroke-width="1"/>
    <circle cx="20" cy="20" r="6" fill="#f38ba8"/>
    <circle cx="40" cy="20" r="6" fill="#f9e2af"/>
    <circle cx="60" cy="20" r="6" fill="#a6e3a1"/>
    <text x="400" y="25" class="panel-title" text-anchor="middle">— pv log (walk every iteration) —</text>

    <text x="20" y="58" class="fade l7"><tspan class="prompt">$ </tspan><tspan class="cmd">pv log</tspan></text>
    <text x="20" y="80" class="fade l8"><tspan class="dim">commit </tspan><tspan class="hash">791151d…</tspan></text>
    <text x="20" y="98" class="fade l8 dim">parent 4100199…</text>
    <text x="20" y="116" class="fade l8 dim">Date:   Mon Aug 11 09:04:33 2026 +0000</text>
    <text x="20" y="134" class="fade l8"></text>
    <text x="20" y="152" class="fade l8">    refine: summarize now reports tone + title</text>
    <text x="20" y="170" class="fade l9 dim">    …</text>
  </g>

  <!-- ===== Panel 4: branch + A/B ===== -->
  <g transform="translate(40, 740)">
    <rect width="800" height="340" rx="8" fill="url(#term)" stroke="#313244" stroke-width="1"/>
    <circle cx="20" cy="20" r="6" fill="#f38ba8"/>
    <circle cx="40" cy="20" r="6" fill="#f9e2af"/>
    <circle cx="60" cy="20" r="6" fill="#a6e3a1"/>
    <text x="400" y="25" class="panel-title" text-anchor="middle">— pv branch · A/B test two variants —</text>

    <text x="20" y="58" class="fade l10"><tspan class="prompt">$ </tspan><tspan class="cmd">pv branch experiment &amp;&amp; pv checkout experiment</tspan></text>
    <text x="20" y="76" class="fade l10 ok">Created branch 'experiment' at fecff04</text>
    <text x="20" y="94" class="fade l10 ok">Switched to branch 'experiment'</text>

    <text x="20" y="122" class="fade l11 dim"># ...tweak the prompt, commit it, then compare:</text>

    <text x="20" y="150" class="fade l12"><tspan class="prompt">$ </tspan><tspan class="cmd">pv ab main:s.md experiment:s.md -d cases.jsonl --show</tspan></text>
    <text x="20" y="172" class="fade l12 mauve">A/B:  A=main:s.md  B=experiment:s.md  (3 cases)</text>
    <text x="20" y="196" class="fade l13 dim">[1/3] DIFF  differs</text>
    <text x="20" y="214" class="fade l13 dim">--- A vs B ---</text>
    <text x="20" y="232" class="fade l13 del">-A You are a precise summarizer.</text>
    <text x="20" y="250" class="fade l13 add">+B You are a concise summarizer.</text>
    <text x="20" y="268" class="fade l13 dim">--- end ---</text>
    <text x="20" y="292" class="fade l14 teal">Summary: 0 identical, 3 differing (of 3)</text>
    <text x="20" y="316" class="fade l15 dim"># pure local · no model calls · no API keys</text>
  </g>

  <!-- footer -->
  <text x="440" y="1095" class="dim" font-size="12" text-anchor="middle">
    cargo install prv  ·  github.com/lululuhu/prv
  </text>
</svg>
